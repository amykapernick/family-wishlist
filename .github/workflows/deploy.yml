# Deploys to Cloudflare on every push to prod, which includes merged PRs.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers and D1 edit access)
# and CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than racing an older one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm test

      # Applies only migrations the live database hasn't had yet.
      - name: Migrate the live database
        run: npm run db:migrate:remote

      - name: Deploy
        run: npm run deploy
