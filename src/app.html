<!doctype html>
<html lang="en-AU">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#364c93" />
		<script>
			// Runs before CSS paints so a saved theme choice applies immediately,
			// as in house. With no saved choice, data-theme stays unset and the
			// CSS follows the system preference (which also covers no-JS).
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					if (stored === 'light' || stored === 'dark') {
						document.documentElement.dataset.theme = stored;
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
